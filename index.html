<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="index_styles.css">
    <title>Samdek Apps</title>

<body>
    <div class="gradient-bg"></div>

            <a class="app-card" href="guitari/index.html">
