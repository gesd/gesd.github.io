<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitari - Guitar Practice App</title>
    <link rel="stylesheet" href="guitari.css">
</head>
<body>
    <header>
        <img src="guitari_icon.jpg" alt="Guitari Logo" id="logo">
        <h1>Welcome to Guitari!</h1>
        <p>Guitar practice on the go</p>
    </header>

    <main>
        <!-- Email Subscription Section -->
        <section id="email-section">
         
            <iframe 
                src=" https://docs.google.com/forms/d/e/1FAIpQLScedtueXJVvvP2jjWn98_dGuUphn1bFgCBNQW9CNrRJt3VbSA/viewform?usp=dialog" 
                width="100%" 
                height="500" 
                frameborder="0" 
                marginheight="0" 
                marginwidth="0">Loading…
            </iframe>
        </section>

       

    <section id="tester-links">
    <h2>Become a Tester</h2>
    <div class="tester-links">
        <!-- Android Tester -->
        <a href="https://groups.google.com/g/samdekapptest" target="_blank" class="tester-button">
            <img src="android-head_3D.png" alt="Android Tester" class="tester-icon">
            <h3>Android</h3>
            <p>Join the tester group on Google Play to receive beta updates.</p>
        </a>
        
        <!-- iOS Tester -->
        <a href="https://testflight.apple.com/join/Tw87CAT2" target="_blank" class="tester-button">
            <img src="apple-logo-icon-black.png" alt="iOS Tester" class="tester-icon">
            <h3>iOS</h3>
            <p>Download TestFlight and use the link to install the beta version.</p>
        </a>
    </div>
</section>

        <!-- YouTube Video Section -->
        <section id="video-section">
            <h2>Guitari in Action</h2>
            <iframe 
                width="560" 
                height="315" 
                src="https://www.youtube.com/embed/erGXiAYsbjQ" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Guitari. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
