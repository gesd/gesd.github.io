<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitari - Guitar Practice App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="your-logo-path.png" alt="Guitari Logo" id="logo">
        <h1>Welcome to Guitari!</h1>
        <p>Making guitar practice accessible and engaging.</p>
    </header>

    <main>
        <!-- Email Subscription Section -->
        <section id="email-section">
            <h2>Stay Updated</h2>
            <p>Sign up to receive updates about Guitari's release and features:</p>
            <iframe 
                src="https://docs.google.com/forms/d/e/your-google-form-ID/viewform?embedded=true" 
                width="100%" height="500" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
        </section>

        <!-- Tester Links Section -->
        <section id="tester-links">
            <h2>Become a Tester</h2>
            <div class="tester-links">
                <a href="your-android-link" target="_blank">
                    <img src="android-icon.png" alt="Android Tester" class="tester-icon">
                </a>
                <a href="your-apple-link" target="_blank">
                    <img src="apple-icon.png" alt="Apple Tester" class="tester-icon">
                </a>
            </div>
        </section>

        <!-- YouTube Video Section -->
        <section id="video-section">
            <h2>Guitari in Action</h2>
            <iframe 
                width="560" 
                height="315" 
                src="your-youtube-video-link" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Guitari. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
